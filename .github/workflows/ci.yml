name: ci
on:
  push: { branches: [main] }
  pull_request: {}

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    env:
      FINROOT_LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/unit/test_metrics_freshness.py does `git rev-list as_of_sha..HEAD`
          # to check ancestry; the default shallow (depth-1) checkout doesn't have
          # as_of_sha as a reachable object, so that command errors with "bad
          # revision" on every run. Full history avoids that.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-timeout
          pip install -e .
      - name: lint
        run: ruff check src/ tests/ scripts/
      - name: test (fast)
        run: python -m pytest tests/ -q -m "not slow and not stress" --timeout=120

  validators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The verifier is fetched from outside the repo under test. A gate that
      # lives in the repo it judges can be edited by whatever is being judged.
      - name: Fetch Adaptoid validators
        run: git clone --depth 1 https://github.com/Srujan0798/Adaptoid-OS.git /tmp/adaptoid-os

      - name: Preflight (25 validators, incl. FM-09b entailment)
        run: bash /tmp/adaptoid-os/validators/preflight.sh .
