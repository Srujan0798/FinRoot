name: test
on:
  push: { branches: [main] }
  pull_request: {}

jobs:
  full-suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      FINROOT_LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/unit/test_metrics_freshness.py does `git rev-list as_of_sha..HEAD`
          # to check ancestry; the default shallow (depth-1) checkout doesn't have
          # as_of_sha as a reachable object, so that command errors with "bad
          # revision" on every run. Full history avoids that.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip install -e .
      - name: full test suite
        run: PYTHONPATH=src python3 -m pytest tests/ -q
      - name: golden tests
        run: PYTHONPATH=src python3 -m pytest tests/golden/ -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            test-results/
            .pytest_cache/
          if-no-files-found: ignore
