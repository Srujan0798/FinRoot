# FinRoot default stack. `docker compose up` → UI on :8501, Mock mode, no keys needed.
services:
  finroot:
    build: { context: ., dockerfile: Dockerfile }
    image: finroot:demo
    ports:
      - "8501:8501"
    environment:
      FINROOT_LLM_PROVIDER: mock
    # optional .env mount (commented)
    # volumes:
    #   - ./.env:/app/.env:ro
    restart: unless-stopped
    healthcheck:
      # curl is not installed in the python:3.11-slim base image; this
      # overrides the Dockerfile's HEALTHCHECK, so it must use the same
      # python-urllib probe (curl here silently makes the container
      # permanently "unhealthy" even though the app is serving fine).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s