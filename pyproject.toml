[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finroot"
version = "0.1.0"
description = "Sovereign, reasoning-first, auditable AI financial agent (LangChain + LangGraph)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Srujan" }]
dependencies = [
  "langchain>=0.3,<0.4",
  "langgraph>=0.2,<0.3",
  "langchain-core>=0.3,<0.4",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "typer>=0.12,<1",
  "rich>=13",
  "numpy>=1.26",
  "scipy>=1.13",
  "python-dateutil>=2.9",
  "streamlit>=1.36",
  "yfinance>=0.2.40",
  "requests>=2.32",
]

[project.optional-dependencies]
# streamlit is already a base dependency; this extra exists only so the
# documented `pip install -e ".[ui]"` command resolves without a
# "does not provide the extra" warning for a first-time judge/stranger.
ui = []
vector = ["chromadb>=0.5"]
groq = ["groq>=0.9"]
openai = ["openai>=1.40"]
sentiment = ["transformers>=4.42", "torch>=2.3"]
dev = ["pytest>=8.2", "pytest-cov>=5", "pytest-timeout>=2.3", "ruff>=0.5"]

[project.scripts]
finroot = "interface.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["finroot*", "interface*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "R", "S", "ASYNC"]
ignore = [
  "E501",   # line length handled by formatter
  "S101",   # allow `assert` in tests (pytest convention)
  "S301",   # allow pickle (used in some test fixtures)
  "RUF012", # allow mutable class attributes (pydantic config uses these)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S",      # security rules don't apply to test code (we want subprocess, /tmp, etc.)
  "RUF012", # pydantic class attrs in test fixtures
]
"scripts/**/*.py" = [
  "S603",   # scripts intentionally call subprocess
  "S607",   # scripts intentionally use system PATH
  "S310",   # scripts may open URLs
]
"src/finroot/evaluation/**" = [
  "S607",   # harness needs git/python in PATH
  "S603",   # harness needs subprocess
]
"src/finroot/tools/**" = [
  "S310",   # currency tool opens URLs
  "S603",   # tools may need subprocess
]
"src/finroot/agents/**" = [
  "S603",
  "S607",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=60"
pythonpath = ["src"]
markers = [
  "wave1: foundation tests",
  "integration: cross-module tests",
  "e2e: end-to-end tests",
  "golden: hand-graded reasoning quality tests",
  "security: input-validation and injection-prevention tests",
  "slow: tests that take >30s (subprocess, full eval, etc.); skip with -m 'not slow'",
  "stress: stress tests (concurrency, large inputs); skip with -m 'not stress'",
  "performance: performance regression tests",
]
